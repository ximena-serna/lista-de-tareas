<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <style>
    .completada { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>Lista de tareas</h1>

  <form action="{{ url_for('agregar') }}" method="post">
    <input type="text" name="texto" placeholder="Escribe una tarea" required maxlength="200" autofocus>
    <button type="submit">Agregar</button>
  </form>

  {% if tareas %}
    <ul>
      {% for tarea in tareas %}
        <li>
          <span class="{{ 'completada' if tarea.completada else '' }}">{{ tarea.texto }}</span>
          <form action="{{ url_for('completar', tarea_id=tarea.id) }}" method="post" style="display: inline;">
            <button type="submit">{{ 'Desmarcar' if tarea.completada else 'Completar' }}</button>
          </form>
          <form action="{{ url_for('eliminar', tarea_id=tarea.id) }}" method="post" style="display: inline;">
            <button type="submit">Eliminar</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No hay tareas todavía.</p>
  {% endif %}
</body>
</html>
